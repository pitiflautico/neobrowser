# cargo-deny configuration.
#
# The point is to fail CI on things a human would otherwise only notice during an
# audit: a vulnerable transitive dependency, a licence we cannot ship, or a crate
# that has been yanked or abandoned.

[advisories]
# Unmaintained crates are a finding, not a footnote: an unmaintained dependency is
# one that will not get the next security fix.
yanked = "deny"

[licenses]
# MIT-licensed project. This list is what can be linked into the binary without
# changing the terms downstream users get.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

[bans]
# Duplicate major versions of the same crate bloat the binary and mean two copies of
# any bug. A warning rather than a denial: transitive graphs routinely have some, and
# failing on them would make the check something people disable.
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
