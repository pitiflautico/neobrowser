[package]
name = "neobrowser"
version = "0.2.0"
edition = "2021"
rust-version = "1.82"
description = "A fast, stealthy MCP browser-automation server that drives real Chrome — Rust port."
license = "MIT"
repository = "https://github.com/pitiflautico/neobrowser"

[[bin]]
name = "neobrowser"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "io-std", "sync", "time", "process", "signal"] }
tokio-tungstenite = "0.24"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

# HTTP: CDP /json endpoints (localhost) + the browse/download tools (public https).
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# Cookie decryption (cross-platform). macOS/Linux use AES-128-CBC; Windows AES-256-GCM.
aes = "0.8"
cbc = "0.1"
aes-gcm = "0.10"
pbkdf2 = { version = "0.12", default-features = false }
hmac = "0.12"
sha1 = "0.10"
base64 = "0.22"
# Read the real Chrome profile's Cookies SQLite for real-session auto-auth.
rusqlite = { version = "0.32", features = ["bundled"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
