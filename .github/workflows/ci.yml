name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    name: Rust build + test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1
        id: chrome
        with:
          chrome-version: stable
      - name: Format check
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test (incl. live-Chrome stealth verification)
        # Chrome is installed above, so the stealth integration test actually runs
        # (it self-skips only when no Chrome is present). NEOBROWSER_DISABLE_GPU
        # forces software rendering on the GPU-less runner.
        env:
          NEOBROWSER_CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
          NEOBROWSER_DISABLE_GPU: "1"
        run: cargo test

  python:
    name: Python oracle tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - run: python -m pytest -q
